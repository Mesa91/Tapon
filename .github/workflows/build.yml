name: Compila e pubblica

# A ogni push su main:
# 1. ricompila la card e salva il file compilato (se è cambiato);
# 2. se la versione in manifest.json non ha ancora una release, la crea:
#    è quello che HACS mostra come "versione disponibile".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compila la card
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit -p tsconfig.json
          npm run build
          node --check ../custom_components/tapon/frontend/tapon-card.js
      - name: Salva il file compilato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/tapon/frontend/tapon-card.js
          git diff --cached --quiet || git commit -m "Ricompila la card"
          git push
      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('custom_components/tapon/manifest.json'))['version'])")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "La release v$VERSION esiste già"
          else
            gh release create "v$VERSION" --target "$(git rev-parse HEAD)" --title "Tapon $VERSION" --generate-notes
          fi
