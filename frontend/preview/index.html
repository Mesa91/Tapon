<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tapon – anteprima</title>
  <style>
    body { margin: 0; padding: 16px; font-family: Roboto, system-ui, sans-serif; background: #111;
      --primary-text-color: #e8e8e8; --secondary-text-color: #9a9a9a; --card-background-color: #1c1c1c;
      --divider-color: #333; --secondary-background-color: #262626; color: var(--primary-text-color); }
    ha-card { display: block; background: var(--card-background-color); border-radius: 12px; }
  </style>
</head>
<body>
  <tapon-card></tapon-card>
  <script>
    // Minimal in-memory imitation of the integration, for trying the card
    // without Home Assistant: `python3 -m http.server` in this folder's parent.
    customElements.define("ha-card", class extends HTMLElement {});
    const types = { red: { label: "Rosso", color: "#7b1e2b" }, white: { label: "Bianco", color: "#e9dca4" },
      rose: { label: "Rosato", color: "#e79bb3" }, sparkling: { label: "Bollicine", color: "#c9d97a" },
      dessert: { label: "Dolce", color: "#d9a03a" } };
    const reasons = { drank: "Bevuta", gifted: "Regalata", broken: "Rotta", spoiled: "Andata a male", deleted: "Eliminata", other: "Altro" };
    let n = 0; const id = (p) => p + (++n);
    const db = { racks: [{ id: "rack-a", name: "Scaffale", rows: 7, cols: 10, shelves: [10, 10, 10, 10, 10, 10, 10], order: 0 }], bottles: [], history: [],
      settings: { auto_labels: true, alert_days: 180, label_format: "qr" },
      wishlist: [{ id: "w1", name: "Sassicaia", producer: "Tenuta San Guido", vintage: 2019, type: "red", region: "Bolgheri", added_at: "2026-10-01", source: "manual", where: "Cena da Marco", wish_notes: "Chiedere all'enoteca" }], inventory: null };
    const seed = [["Barolo Cannubi", "Brezza", 2016, "red", 2022, 2034, 3], ["Brunello di Montalcino", "Mastrojanni", 2015, "red", 2020, 2026, 2],
      ["Soave Classico", "Pieropan", 2019, "white", 2020, 2024, 1], ["Franciacorta Satèn", "Ca' del Bosco", null, "sparkling", null, 2027, 4],
      ["Chiaretto", "Zenato", 2023, "rose", 2024, 2026, 2], ["Passito di Pantelleria", "Donnafugata", 2018, "dessert", 2020, 2040, 1]];
    let pos = 0;
    for (const [name, producer, vintage, type, f, u, q] of seed) for (let i = 0; i < q; i++, pos++)
      db.bottles.push({ id: id("b"), code: "k7m2xq9" + pos, name, producer, vintage, type, drink_from: f, drink_until: u,
        rack_id: "rack-a", row: Math.floor(pos / 10), col: pos % 10, added_at: new Date().toISOString(), price: [38, 55, 16, 29, 12, null][seed.findIndex((x) => x[0] === name)], drink_peak: name === "Barolo Cannubi" ? 2028 : null, ...(name === "Barolo Cannubi" ? { serve_temp: "16–18 °C", decant: "1 ora", glass: "calice Borgogna" } : {}) });
    db.history.push({ ...db.bottles[0], id: "old1", history_id: "h0", removed_at: "2026-09-12T20:00:00Z", reason: "drank", rating: 5, tasting_notes: "Splendido con il brasato, ricomprare" });
    const alertOf = (b) => { if (!b.drink_until) return null; const days = (new Date(b.drink_until, 11, 31) - new Date()) / 864e5;
      return days < 0 ? "past" : days <= db.settings.alert_days ? "closing" : null; };
    const wk = (b) => b.name + "|" + b.vintage;
    const past = (b) => { const hs = db.history.filter((h) => wk(h) === wk(b) && (h.rating || h.tasting_notes)); if (!hs.length) return {};
      const r = hs.filter((h) => h.rating); return { past_rating: r.length ? r.reduce((a, h) => a + h.rating, 0) / r.length : null, past_count: r.length, past_notes: (hs[hs.length - 1].tasting_notes || "") }; };
    const value = () => { const p = db.bottles.filter((b) => b.price > 0); return { total: p.reduce((a, b) => a + b.price, 0), priced: p.length, bottles: db.bottles.length }; };
    const invReport = () => { const inv = db.inventory; if (!inv) return null;
      const scope = db.bottles.filter((b) => !inv.rack_id || b.rack_id === inv.rack_id);
      return { started_at: "", rack_id: inv.rack_id, total: scope.length, seen: scope.filter((b) => inv.seen.includes(b.code)).length,
        unknown: inv.unknown, last: inv.last, missing: scope.filter((b) => !inv.seen.includes(b.code)).map((b) => b.id),
        misplaced: db.bottles.filter((b) => inv.seen.includes(b.code) && inv.rack_id && b.rack_id !== inv.rack_id).map((b) => b.id), found_taken: inv.found };
    };
    const snap = () => ({ racks: db.racks, bottles: db.bottles.map((b) => ({ ...b, alert: alertOf(b), ...past(b) })), settings: db.settings, value: value(), wishlist: [...db.wishlist].reverse(), inventory: invReport(), highlight: db.highlight || null,
      types, reasons, history_count: db.history.length, ai: true, printer: false,
      climate: { temperature_entity: "sensor.cantina_temperatura", humidity_entity: "sensor.cantina_umidita",
        temperature_min: 10, temperature_max: 16, humidity_min: 60, humidity_max: 80 } });
    const subs = [];
    const changed = () => subs.forEach((cb) => cb(snap()));
    const free = (rack) => { const t = new Set(db.bottles.filter((b) => b.rack_id === rack.id).map((b) => b.row + ":" + b.col));
      const out = []; rack.shelves.forEach((n, r) => { for (let c = 0; c < n; c++) if (!t.has(r + ":" + c)) out.push([r, c]); }); return out; };
    const handlers = {
      "tapon/add_bottles": (m) => { const rack = db.racks.find((r) => r.id === m.rack_id) || db.racks[0]; let slots = rack ? free(rack) : [];
        if (m.row != null) slots = slots.filter(([r, c]) => r > m.row || (r === m.row && c >= m.col)).concat(slots.filter(([r, c]) => r < m.row || (r === m.row && c < m.col)));
        const added = []; for (let i = 0; i < (m.quantity || 1); i++) { const s = slots[i];
          const b = { ...m.wine, vintage: m.wine.vintage ? Number(m.wine.vintage) : null, drink_from: m.wine.drink_from ? Number(m.wine.drink_from) : null,
            drink_until: m.wine.drink_until ? Number(m.wine.drink_until) : null, id: id("b"), code: "new" + n,
            rack_id: s ? rack.id : null, row: s ? s[0] : null, col: s ? s[1] : null, added_at: new Date().toISOString() };
          db.bottles.push(b); added.push(b); } if (m.wish_id) db.wishlist = db.wishlist.filter((w) => w.id !== m.wish_id); changed(); return { bottles: added }; },
      "tapon/remove_bottle": (m) => { const i = db.bottles.findIndex((b) => b.id === m.bottle_id); const [b] = db.bottles.splice(i, 1);
        if (db.highlight) { db.highlight.groups = db.highlight.groups.filter((g) => !g.bottle_ids.includes(b.id)); if (!db.highlight.groups.length) db.highlight = null; }
        db.history.push({ ...b, history_id: id("h"), removed_at: new Date().toISOString(), reason: m.reason, rating: m.rating, tasting_notes: m.tasting_notes }); changed(); return {}; },
      "tapon/check_wine": (m) => { const w = m.wine || { name: "Barolo Cannubi", producer: "Brezza", vintage: 2016, type: "red", region: "Barolo DOCG" };
        const q = (w.name || "").toLowerCase(); const hit = (b) => (b.name || "").toLowerCase().includes(q) || q.includes((b.name || "").toLowerCase());
        const grp = {}; db.bottles.filter(hit).forEach((b) => { const k = b.name + b.vintage; (grp[k] = grp[k] || { match: !w.vintage || w.vintage === b.vintage ? "same" : "vintage", name: b.name, producer: b.producer, vintage: b.vintage, type: b.type, bottles: 0, bottle_ids: [], locations: [], reserved: 0 });
          grp[k].bottles++; grp[k].bottle_ids.push(b.id); grp[k].locations.push("Scaffale · mensola " + (b.row + 1) + ", posto " + (b.col + 1)); if (b.reserved_for) grp[k].reserved++; });
        const dr = db.history.filter((h) => hit(h) && h.reason === "drank");
        return new Promise((ok) => setTimeout(() => ok({ wine: { type: "red", ...w }, cellar: Object.values(grp),
          drunk: dr.length ? [{ match: "same", name: dr[0].name, producer: dr[0].producer, vintage: dr[0].vintage, times: dr.length, rating: 5, notes: dr[0].tasting_notes || "", last: dr[0].removed_at }] : [],
          wished: db.wishlist.filter(hit).map((x) => ({ match: "same", name: x.name, vintage: x.vintage, wish_id: x.id, source: x.source })) }), 500)); },
      "tapon/open_bottle": (m) => { const b = db.bottles.find((x) => x.id === m.bottle_id); Object.assign(b, { rack_id: null, row: null, col: null, opened_at: new Date(Date.now() - 3 * 864e5).toISOString(), opened_days: 3, opened_state: "today" }); changed(); return { bottle: b, limit: 3 }; },
      "tapon/highlight": (m) => { db.highlight = { source: m.source, query: m.query, groups: m.groups }; changed(); return { highlight: db.highlight }; },
      "tapon/highlight_clear": () => { db.highlight = null; changed(); return {}; },
      "tapon/reserve_bottle": (m) => { const b = db.bottles.find((x) => x.id === m.bottle_id); delete b.reserved_for; delete b.reserved_until;
        if (m.reserved_for) { b.reserved_for = m.reserved_for; if (m.reserved_until) b.reserved_until = m.reserved_until; } changed(); return { bottle: b }; },
      "tapon/wishlist_add": (m) => { const w = { ...m.wine, id: id("w"), added_at: new Date().toISOString(), source: "manual", where: m.where, wish_notes: m.wish_notes }; db.wishlist.push(w); changed(); return { wish: w }; },
      "tapon/wishlist_remove": (m) => { db.wishlist = db.wishlist.filter((w) => w.id !== m.wish_id); changed(); return {}; },
      "tapon/inventory_start": (m) => { db.inventory = { rack_id: m.rack_id || null, seen: [], found: [], unknown: 0, last: null }; changed(); return { inventory: invReport() }; },
      "tapon/inventory_stop": () => { const r = invReport(); db.inventory = null; changed(); return { inventory: r }; },
      "tapon/take_code": (m) => { const code = m.code.replace("tapon-", ""); const b = db.bottles.find((x) => x.code === code);
        if (db.inventory && b) { if (!db.inventory.seen.includes(code)) db.inventory.seen.push(code); db.inventory.last = { code, name: b.name, vintage: b.vintage, result: "ok" }; changed(); }
        return { result: "inventory_ok" }; },
      "tapon/remove_bottles": (m) => { m.bottle_ids.forEach((i) => handlers["tapon/remove_bottle"]({ bottle_id: i, reason: m.reason })); return { removed: m.bottle_ids.length }; },
      "tapon/rate_history": (m) => { const h = db.history.find((x) => x.history_id === m.history_id); h.rating = m.rating || undefined; h.tasting_notes = m.tasting_notes || undefined; changed(); return { entry: h }; },
      "tapon/move_bottle": (m) => { const b = db.bottles.find((x) => x.id === m.bottle_id);
        const o = db.bottles.find((x) => x.rack_id === m.rack_id && x.row === m.row && x.col === m.col);
        if (o) Object.assign(o, { rack_id: b.rack_id, row: b.row, col: b.col }); Object.assign(b, { rack_id: m.rack_id, row: m.row, col: m.col }); changed(); return {}; },
      "tapon/update_bottle": (m) => { const b = db.bottles.find((x) => x.id === m.bottle_id); Object.assign(b, m.changes); changed(); return { updated: 1 }; },
      "tapon/get_history": () => ({ history: [...db.history].reverse() }),
      "tapon/restore": (m) => { const i = db.history.findIndex((h) => h.history_id === m.history_id); const [h] = db.history.splice(i, 1);
        db.bottles.push(h); changed(); return { bottle: h }; },
      "tapon/save_rack": (m) => { let r = db.racks.find((x) => x.id === m.rack.id);
        if (!r) { r = { id: id("rack-"), order: db.racks.length }; db.racks.push(r); } const sh = m.rack.shelves || Array(m.rack.rows || 5).fill(m.rack.cols || 8);
        Object.assign(r, { name: m.rack.name, shelves: sh, rows: sh.length, cols: Math.max(...sh) }); changed(); return { rack: r, displaced: 0 }; },
      "tapon/delete_rack": (m) => { db.racks = db.racks.filter((r) => r.id !== m.rack_id);
        db.bottles.forEach((b) => { if (b.rack_id === m.rack_id) Object.assign(b, { rack_id: null, row: null, col: null }); }); changed(); return { displaced: 0 }; },
      "tapon/update_settings": (m) => { if ("auto_labels" in m) db.settings.auto_labels = m.auto_labels; if ("alert_days" in m) db.settings.alert_days = m.alert_days; if ("label_format" in m) db.settings.label_format = m.label_format; changed(); return {}; },
      "tapon/get_label": () => ({ code: "k7m2xq9p", png_base64: (db.settings.label_format === "qr" ? window.QR_PNG : window.LABEL_PNG) || "", label_format: db.settings.label_format, width_mm: db.settings.label_format === "qr" ? 23 : 50, height_mm: db.settings.label_format === "qr" ? 23 : 30 }),
      "tapon/request_label": () => ({}),
      "tapon/ai_recognize": (m) => (window.AI_CALLS = (window.AI_CALLS || []).concat([{ back: !!m.back_image }]), { wine: { name: "Rosé di Morgante", producer: "Morgante", vintage: 2023, type: "rose",
        region: "Sicilia DOC", country: "Italia", grape: "Nero d'Avola", alcohol: "12,5%", drink_from: 2024, drink_until: 2026,
        description: "Rosato tenue e floreale, con note di fragolina e agrumi. Fresco e sapido.", food_pairings: "crudi di pesce, couscous, pizza bianca" } }),
      "tapon/pair": (m) => { const ws = []; const seen = {}; for (const b of db.bottles) { const k = b.name + "|" + b.vintage; if (!seen[k]) { seen[k] = { key: k, name: b.name, producer: b.producer || "", vintage: b.vintage, type: b.type, status: (alertOf(b) || "ready"), bottles: 0, bottle_ids: [], locations: ["Scaffale · mensola " + ((b.row ?? 0) + 1) + ", posto " + ((b.col ?? 0) + 1)] }; ws.push(seen[k]); } seen[k].bottles++; seen[k].bottle_ids.push(b.id); }
        ws.forEach((w) => { const p = past(db.bottles.find((b) => b.id === w.bottle_ids[0])); w.rating = p.past_rating || null; });
        const reds = ws.filter((w) => w.type === "red").slice(0, 2);
        if (m.courses) { const by = (t) => ws.find((w) => w.type === t) || null;
          const plan = [by("sparkling"), by("white"), reds[0], by("dessert")];
          return new Promise((ok) => setTimeout(() => ok({ source: "ai", advice: "Apri il Barolo un'ora prima; bollicine e bianco in frigo dal pomeriggio.",
            courses: m.courses.map((c, i) => ({ course: c, wine: plan[i] ? { ...plan[i], reason: "" } : null, reason: plan[i] ? "Accompagna bene " + c.toLowerCase() + "." : "" })),
            one: { ...ws.find((w) => w.type === "sparkling"), reason: "Le bollicine reggono tutto il menu, dall'antipasto al dolce." } }), 600)); }
        return new Promise((ok) => setTimeout(() => ok({ source: "ai", advice: "Servilo a 18 °C dopo mezz'ora di decanter.", picks: reds.map((w, i) => ({ ...w, reason: i ? "Più leggero, regge comunque il sugo." : "Tannino e struttura reggono la lunga cottura del " + m.dish.toLowerCase() + "." })) }), 600)); },
      "tapon/ai_fill": (m) => ({ wine: { producer: "Brezza", region: "Barolo DOCG", country: "Italia", grape: "Nebbiolo", drink_from: 2024, drink_until: 2036, drink_peak: 2030, serve_temp: "10–12 °C", decant: "no", glass: "tulipano" } }),
    };
    customElements.whenDefined("tapon-card").then(() => {
    const card = document.querySelector("tapon-card");
    card.setConfig({ type: "custom:tapon-card" });
    card.hass = {
      states: { "sensor.cantina_temperatura": { state: "17.4" }, "sensor.cantina_umidita": { state: "68" } },
      callWS: async (m) => { const h = handlers[m.type]; if (!h) throw new Error("mock: " + m.type); return JSON.parse(JSON.stringify(await h(m))); },
      connection: { subscribeMessage: async (cb) => { subs.push(cb); setTimeout(() => cb(snap())); return () => {}; } },
    };
    });
  </script>
  <script type="module" src="../../custom_components/tapon/frontend/tapon-card.js"></script>
</body>
</html>
